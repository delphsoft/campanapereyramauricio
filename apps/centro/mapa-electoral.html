<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa Electoral Dinámico · La Calera 2027 · Pereyra</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #0f1419;
    --card: #1a2332;
    --border: #2d3a4d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --a: #3fb950;
    --b: #d29922;
    --c: #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; }
  #sidebar { width: 380px; background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  #sidebar header { padding: 1rem 1.2rem; border-bottom: 1px solid var(--border); background: #161b22; }
  #sidebar h1 { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
  #sidebar .sub { font-size: 0.75rem; color: var(--muted); margin-top: 0.25rem; }
  #controls { padding: 0.8rem 1.2rem; border-bottom: 1px solid var(--border); }
  .filters { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .filter-btn { background: #21262d; border: 1px solid var(--border); color: var(--text); padding: 0.35rem 0.7rem; border-radius: 99px; font-size: 0.75rem; cursor: pointer; }
  .filter-btn.active { background: var(--accent); color: #000; }
  .filter-btn.b.active { background: var(--b); color: #000; }
  .filter-btn.c.active { background: var(--c); }
  #list { flex: 1; overflow-y: auto; padding: 0.5rem 0; }
  .item { padding: 0.7rem 1.2rem; border-bottom: 1px solid var(--border); cursor: pointer; }
  .item:hover { background: #21262d; }
  .item h3 { font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem; }
  .badge { font-size: 0.65rem; padding: 0.1rem 0.45rem; border-radius: 99px; font-weight: 700; }
  .badge.b { background: var(--b); color: #000; }
  .badge.c { background: var(--c); }
  .item p { font-size: 0.75rem; color: var(--muted); margin-top: 0.25rem; }
  #map { flex: 1; height: 100vh; }
  .leaflet-popup-content-wrapper { background: var(--card); color: var(--text); border-radius: 10px; max-width: 320px; }
  .leaflet-popup-tip { background: var(--card); }
  .popup-title { font-weight: 700; font-size: 1rem; margin-bottom: 0.3rem; }
  .popup-meta { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.5rem; }
  .popup-section { margin-top: 0.4rem; font-size: 0.78rem; line-height: 1.4; }
  .popup-section strong { color: var(--accent); }
  .legend { position: absolute; bottom: 20px; right: 20px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 0.8rem 1rem; font-size: 0.75rem; z-index: 1000; }
  .legend div { display: flex; align-items: center; gap: 0.4rem; margin: 0.2rem 0; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  @media (max-width: 700px) { body { flex-direction: column; } #sidebar { width: 100%; height: 40vh; } #map { height: 60vh; } }
</style>
</head>
<body>
<div id="sidebar">
  <header>
    <h1>Mapa Electoral · La Calera 2027</h1>
    <div class="sub">Mauricio Pereyra · Click en zona para datos ricos</div>
  </header>
  <div id="controls">
    <div style="font-size:0.75rem; color:var(--muted); margin-bottom:0.3rem;">Filtrar</div>
    <div class="filters" id="class-filters">
      <button class="filter-btn active" data-filter="all">Todos</button>
      <button class="filter-btn b" data-filter="B">B Swing</button>
      <button class="filter-btn c" data-filter="C">C</button>
    </div>
  </div>
  <div id="list"></div>
</div>
<div id="map"></div>
<div class="legend">
  <div><span class="dot" style="background:#d29922"></span> B · Disputable</div>
  <div><span class="dot" style="background:#f85149"></span> C · Adversario</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const zones = [
  { id: "industrial", name: "Industrial + Dr. Cocca + Altos + Los Prados", class: "B", lat: -31.352, lng: -64.338, priority: "Alta",
    etario: "Joven-adulto (muchos 25-45). Familias.", socio: "Medio-bajo a medio. Alta densidad.", comercios: "Locales de barrio, servicios básicos, algo de industria.", voto: "2023: disputado. Volumen alto.", effort: "Alto (60% esfuerzo). Muchas puertas.", issues: "Agua fuerte, salud.", action: "100 días: presión + fugas + CAPS." },
  { id: "central", name: "Calera Central + Los Paraísos", class: "B", lat: -31.348, lng: -64.332, priority: "Alta",
    etario: "Mixto, familias consolidadas.", socio: "Medio.", comercios: "Comercio de centro, servicios.", voto: "Transición. Margen chico posible.", effort: "Alto.", issues: "Agua, peaje, calles.", action: "Desagües + pavimento + peaje." },
  { id: "cuesta", name: "Cuesta Colorada + cerrados este", class: "B", lat: -31.356, lng: -64.312, priority: "Alta-Media",
    etario: "Adultos jóvenes y familias. Dormitorio.", socio: "Medio-alto (cerrados).", comercios: "Pocos locales, dependen de Córdoba.", voto: "Sensible a peaje y servicios.", effort: "Alta-Media.", issues: "Peaje fuerte, agua.", action: "Postura peaje + seguridad." },
  { id: "stocklin", name: "Stöcklin", class: "B", lat: -31.350, lng: -64.325, priority: "Media",
    etario: "Adultos, familias.", socio: "Medio-alto (residencial por excelencia).", comercios: "Servicios locales, calidad.", voto: "Abierto a gestión por resultados.", effort: "Media.", issues: "Peaje, transparencia.", action: "Obras visibles + peaje." },
  { id: "norte", name: "Casco norte (Maipú, 25 de Mayo, 9 de Julio, COVICO, La Isla...)", class: "B", lat: -31.340, lng: -64.336, priority: "Media",
    etario: "Mixto, más adultos mayores en casco.", socio: "Medio-bajo a medio. Histórico.", comercios: "Comercio tradicional de casco.", voto: "Históricamente más PJ. Medir fino.", effort: "Media.", issues: "Agua, salud.", action: "Escucha + servicios básicos." },
  { id: "dumesnil", name: "Dumesnil", class: "B", lat: -31.328, lng: -64.342, priority: "Media",
    etario: "Crecimiento, familias jóvenes. ~3500+ hab.", socio: "Medio.", comercios: "En desarrollo.", voto: "Zona de crecimiento. Potencial.", effort: "Media.", issues: "Agua, accesos.", action: "Relevamiento agua y conectividad." },
  { id: "cerrados", name: "Cerrados (La Estanzuela, La Cuesta, La Pankana, etc.)", class: "B", lat: -31.360, lng: -64.300, priority: "Media",
    etario: "Familias de ingresos medios-altos.", socio: "Medio-alto / alto.", comercios: "Internos o dependen de capital.", voto: "Sensible a peaje y calidad de vida.", effort: "Media (acceso controlado).", issues: "Peaje, seguridad.", action: "Mensaje de gestión y peaje." },
  { id: "oeste", name: "El Diquecito / Casa Bamba", class: "C", lat: -31.360, lng: -64.380, priority: "Baja",
    etario: "Menor densidad.", socio: "Mixto rural-urbano.", comercios: "Muy pocos.", voto: "Menor peso.", effort: "Bajo.", issues: "Agua.", action: "Cobertura mínima." }
];

const map = L.map('map').setView([-31.345, -64.335], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

const classColors = { B: '#d29922', C: '#f85149' };
const zoneMarkers = {};

function createPopup(z) {
  return `<div class="popup-title">${z.name}</div>
    <div class="popup-meta"><span class="badge ${z.class.toLowerCase()}">${z.class}</span> · Prioridad ${z.priority}</div>
    <div class="popup-section"><strong>Etario:</strong> ${z.etario}</div>
    <div class="popup-section"><strong>Nivel socio:</strong> ${z.socio}</div>
    <div class="popup-section"><strong>Comercios:</strong> ${z.comercios}</div>
    <div class="popup-section"><strong>Voto 2023 (proxy):</strong> ${z.voto}</div>
    <div class="popup-section"><strong>Issues:</strong> ${z.issues}</div>
    <div class="popup-section"><strong>Esfuerzo:</strong> ${z.effort}</div>
    <div class="popup-section"><strong>Acción 100 días:</strong> ${z.action}</div>`;
}

zones.forEach(z => {
  const m = L.circleMarker([z.lat, z.lng], {
    radius: z.priority.includes('Alta') ? 12 : 9,
    fillColor: classColors[z.class],
    color: '#fff', weight: 2, fillOpacity: 0.85
  }).addTo(map).bindPopup(createPopup(z));
  zoneMarkers[z.id] = m;
});

function renderList(filter = 'all') {
  const list = document.getElementById('list');
  list.innerHTML = '';
  zones.filter(z => filter === 'all' || z.class === filter).forEach(z => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `<h3><span class="badge ${z.class.toLowerCase()}">${z.class}</span> ${z.name}</h3><p>${z.socio} · ${z.priority}</p>`;
    div.onclick = () => { map.setView([z.lat, z.lng], 15); zoneMarkers[z.id].openPopup(); };
    list.appendChild(div);
  });
}
renderList();

document.querySelectorAll('#class-filters .filter-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#class-filters .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const f = btn.dataset.filter;
    renderList(f);
    Object.values(zoneMarkers).forEach(m => map.removeLayer(m));
    zones.filter(z => f === 'all' || z.class === f).forEach(z => zoneMarkers[z.id].addTo(map));
  };
});

const bounds = L.latLngBounds(zones.map(z => [z.lat, z.lng]));
map.fitBounds(bounds.pad(0.2));
</script>
</body>
</html>
